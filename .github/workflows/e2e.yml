name: E2E Tests

on:

  pull_request:
  push:
    branches:
      - main
      - develop
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          # full history so the PR base commit is available to diff against
          fetch-depth: 0

      - name: Select tests
        id: select
        run: |
          markers="not periodic"
          if [ "${{ github.event_name }}" = "pull_request" ] && ! git diff --name-only \
              ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- \
              content/show content/people content/sponsors \
              themes/jb/layouts/episode themes/jb/layouts/partials/episode \
              themes/jb/layouts/partials/people themes/jb/layouts/partials/sponsor \
              themes/jb/layouts/partials/meta.html \
              test/e2e/test_episode.py test/e2e/episode_data.py test/conftest.py pytest.ini \
              | grep -q .; then
            markers="not periodic and not episodes"
          fi
          echo "markers=$markers" >> "$GITHUB_OUTPUT"

      # using docker compose, so we can re-use local Dockerfiles
      - name: starting up containers
        working-directory: ./test/
        env:
          # https://stackoverflow.com/a/52192327
          DOCKER_BUILDKIT: 1
          # https://stackoverflow.com/a/69500575
          BUILDKIT_PROGRESS: plain
        run: docker compose up -d --build

      - name: Run your tests
        working-directory: ./test/
        # https://github.com/actions/runner/issues/241#issuecomment-577360161
        run: script -e -c "docker compose exec testing pytest -m '${{ steps.select.outputs.markers }}' --base-url http://jb-com --junitxml report.xml"

      - name: Save screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          overwrite: true

      - name: Publish Test Report
        uses: dorny/test-reporter@v1
        # TODO: potential solution in the future: https://stackoverflow.com/a/70448851
        if: always() && github.event_name != 'pull_request'
        with:
          name: E2E Tests
          path: './report.xml'
          reporter: java-junit
