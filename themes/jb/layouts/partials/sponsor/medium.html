<p>
    <!-- TODO: remove after ads are more mindful about website and no longer include the name of the sponsor as the first word of the description -->
    <strong>{{- .title }}</strong> - {{ replaceRE (print "^" .title "(?: is)? (.*)") "$1" .description -}}
</p>
<p>
    {{- $url := urls.Parse .link -}}
    <a href="{{ .link }}" target="_blank">{{ if findRE "^www\\.(.*)" $url.Host }}{{ $url.Host }}{{else}}{{ $url.Host | title }}{{ end }}{{ if ne $url.Path "/" }}{{- $url.Path -}}{{- end -}}</a>
</p>
